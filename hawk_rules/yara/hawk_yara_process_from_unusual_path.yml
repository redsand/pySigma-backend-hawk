title: HAWK - YARA Match On Process Started Outside Program Files Or Windows
id: 065f9314-6f1c-4a39-9a3e-3d499161c909
status: test
description: |
    The vTTAC agent scans a process image when it starts. A YARA match on an image that is not under
    Program Files or the Windows directory means a matching binary was actually executed from an unusual place.
author: HAWK Defense
date: 2026-10-05
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    product: hawk
    service: yara
detection:
    selection:
        scan_context: 'process_create'
    filter_main_install_dirs:
        filename|startswith:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
            - 'C:\Windows\'
    filter_main_codeintegrity:
        rule_name|startswith: 'CodeIntegrity_'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Portable tools run from a share or a user folder by administrators
level: high
