title: Entra ID Session Token Failures From Cloud Hosting ASN (Base)
id: cbc063bd-d0e0-4aef-afc1-32b07bce8a27
status: experimental
description: Base rule for the token-replay correlation below - Entra ID sign-in failures that mean a presented session or refresh token was rejected, from a cloud hosting or VPN provider network.
author: HAWK Defense
date: 2026-10-06
logsource:
    product: azure
    service: signinlogs
detection:
    selection_code:
        ResultType:
            - 70044    # session expired or invalid (sign-in frequency / CA)
            - 70043    # refresh token expired or invalid due to sign-in frequency
            - 50132    # session invalid: password changed or SSO artifact invalid
            - 50133    # session invalid due to password expiration or recent password change
            - 50089    # flow token expired
    selection_asn:
        AutonomousSystemNumber:
            - 16509    # Amazon AWS
            - 14618    # Amazon AWS
            - 8987     # Amazon AWS (EU)
            - 396982   # Google Cloud
            - 8075     # Microsoft Azure
            - 14061    # DigitalOcean
            - 16276    # OVH
            - 9009     # M247
            - 63949    # Akamai/Linode
            - 20473    # Vultr (Choopa)
            - 24940    # Hetzner
            - 51167    # Contabo
            - 212238   # Datacamp
            - 60068    # Datacamp / CDN77
            - 62240    # Clouvider
    condition: all of selection_*
level: informational
name: hawk_entra_token_failure_hosting_asn
---
title: Possible Stolen Entra ID Session Token Replay From Cloud Hosting Infrastructure
id: dbc2d43f-0fbf-4ceb-b00c-2c5b2fa1590c
status: experimental
description: |
    Twenty or more rejected-session / rejected-token sign-in failures (70044, 70043, 50132, 50133, 50089) for one
    account from one cloud hosting or VPN provider address within an hour. Tools that replay a stolen session or
    refresh token (AiTM phishing kits, infostealer cookie replay) hammer the token endpoint from rented
    infrastructure and keep getting rejected once Conditional Access sign-in frequency or a password change
    invalidates the token. Seen 2026-10-06: 944 x 70044 for one employee from one AWS EC2 address with no
    successful sign-in from it, flagged by Entra Identity Protection as unfamiliar features.
references:
    - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    - https://attack.mitre.org/techniques/T1550/004/
author: HAWK Defense
date: 2026-10-06
tags:
    - attack.defense-evasion
    - attack.lateral-movement
    - attack.t1550.004
correlation:
    type: event_count
    rules:
        - hawk_entra_token_failure_hosting_asn
    group-by:
        - UserPrincipalName
        - IPAddress
    timespan: 1h
    condition:
        gte: 20
falsepositives:
    - Cloud desktops (e.g. AWS WorkSpaces) or company VPN egress in these networks after a password change; add the organisation's egress addresses as a local filter
level: high
