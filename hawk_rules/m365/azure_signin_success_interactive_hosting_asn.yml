title: Risky Successful Interactive Entra ID Sign-In From Cloud Hosting Or VPN Provider ASN
id: 839bb565-29f4-432d-9418-5d9886e8a275
status: experimental
description: |
    Detects a successful interactive Entra ID (Azure AD) sign-in whose source address belongs to a cloud hosting,
    VPS or commercial VPN provider (AWS, Google Cloud, Azure, DigitalOcean, OVH, M247, Linode/Akamai, Vultr, Hetzner,
    Contabo, Datacamp, Clouvider and common VPN egress networks). Employees sign in interactively from ISP, mobile and
    corporate addresses; an interactive success from rented infrastructure is how stolen credentials or session
    replay usually arrive (AiTM kits and operator VPS). Non-interactive token refreshes are excluded because cloud
    desktops (e.g. AWS WorkSpaces) refresh tokens from provider ranges all day.
    Written for HAWK 2026-10-06 after a case where an employee account signed in interactively from an AWS EC2
    address with all-unfamiliar properties; on 30,000 sampled successful sign-ins, 46 came from these ASNs and all
    were non-interactive.
references:
    - https://learn.microsoft.com/en-us/graph/api/resources/signin
    - https://attack.mitre.org/techniques/T1078/004/
author: HAWK Defense
date: 2026-10-06
tags:
    - attack.initial-access
    - attack.defense-evasion
    - attack.t1078.004
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        Status: 'Success'
        IsInteractive: true
        AutonomousSystemNumber:
            - 16509    # Amazon AWS
            - 14618    # Amazon AWS
            - 8987     # Amazon AWS (EU)
            - 396982   # Google Cloud
            - 8075     # Microsoft Azure
            - 14061    # DigitalOcean
            - 16276    # OVH
            - 9009     # M247
            - 63949    # Akamai/Linode
            - 20473    # Vultr (Choopa)
            - 24940    # Hetzner
            - 51167    # Contabo
            - 212238   # Datacamp
            - 60068    # Datacamp / CDN77
            - 62240    # Clouvider
            - 136787   # TEFINCOM (NordVPN egress)
            - 209854   # Surfshark egress
    selection_risk:
        RiskLevelDuringSignIn:
            - 'low'
            - 'medium'
            - 'high'
    condition: selection and selection_risk
falsepositives:
    - Employees who sign in interactively from a cloud desktop or a company-approved VPN hosted in these networks (add their egress addresses as a local filter)
level: medium
