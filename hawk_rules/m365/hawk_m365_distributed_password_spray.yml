title: HAWK - Distributed Password Spray Against Entra ID (10+ Accounts From One Client Fingerprint In 1 Hour)
id: 5569faec-c631-4b27-9b85-90a409a4554c
status: test
description: |
    Ten or more different accounts failed with a bad password or Smart Lockout within one hour from the same
    client fingerprint (application id + user agent). A distributed spray rotates source IPs (one user per IP)
    to stay under per-IP limits, but keeps one tool fingerprint - this groups on that, not on the IP.
author: HAWK Defense
date: 2026-10-06
tags:
    - attack.credential_access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - hawk_entra_failed_password_signin
    group-by:
        - AppId
        - UserAgent
    timespan: 1h
    condition:
        field: UserPrincipalName
        gte: 10
falsepositives:
    - A misconfigured app or expired service credential failing for many users at once
level: high
