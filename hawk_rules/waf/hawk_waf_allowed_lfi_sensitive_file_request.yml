title: HAWK - WAF Allowed A Local File Inclusion Or Sensitive File Request
id: 7a0353ee-99cb-4948-a6aa-900e2db2bb4f
status: test
description: |
    The web application firewall ALLOWED (did not block) a request whose path or query string reaches for local
    files: directory traversal, /proc/self/*, /etc/passwd, or application secret files such as .env. Blocked
    probes are noise; an allowed one reached the application and needs the response checked. Seen 2026-10-06: a
    GCP-hosted scanner had two LFI attempts blocked while /api/system/fileView?file=/proc/self/environ was allowed
    through to the origin.
author: HAWK Defense
date: 2026-10-06
tags:
    - attack.initial-access
    - attack.t1190
    - attack.credential-access
    - attack.t1552.001
logsource:
    product: hawk
    service: waf
detection:
    selection_allowed:
        action: 'ALLOW'
    selection_path:
        - http_path|re: '(?i)(\.\./|\.\.%2f|%2e%2e/|/proc/self/|/etc/(passwd|shadow)|/\.env($|[./?])|/\.git/config|/\.aws/credentials|/wp-config\.php)'
        - http_query|re: '(?i)(\.\./|\.\.%2f|%2e%2e(/|%2f)|/proc/self/|/etc/(passwd|shadow)|(^|[=/])\.env($|&)|/\.git/config|/\.aws/credentials)'
    condition: all of selection_*
falsepositives:
    - Applications that legitimately pass relative paths in query strings (rare; filter the specific endpoint)
level: medium
