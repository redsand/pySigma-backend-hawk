# Local exclusions for noisy scores, applied by sync_scores.py on every push (and by
# refresh_plan.py / local_eval.py when they compare), so a Sigma refresh never drops them.
# Same idea as score_weights.json for weights.
#
# Three tiers - keep them separate:
#   generic   benign on every network (Windows Installer, AWS SSM, Intune, Office, vendor updaters)
#   hawk      HAWK's own software (vTTAC agent) - benign for every HAWK customer
#   customer  one customer's own tools/accounts - scoped to that customer's group subtree, so
#             other customers keep full coverage. `customer:` names a top-level group in the
#             portal group tree (GET /group); every descendant group is included at sync time.
#
# How an exclusion becomes engine logic (no Not node; a missing column counts as "not excluded"):
#   one condition    ->  column != value
#   several (AND)    ->  Or( c1 != v1, c2 != v2 )                       NOT(c1 AND c2)
#   customer scope   ->  Or( And(group_name != g for g in subtree), <exclusion> )
# Matching: equals (case-insensitive, whole value), startswith, endswith, contains, regex (PCRE).
# evidence: share of the score's hits removed (loud_drilldown.py / local_eval.py), with date.

filters:
  - score: 7195a772-4b3f-43a4-a210-6a003d65caa1      # 1307 Suspicious User Agent
    exclusions:
      - name: LANDesk/Ivanti software distribution
        tier: customer
        customer: HUNT
        match: {http_user_agent: {equals: LANDeskDownloader}}
        evidence: "11,199 of 11,336 hits, 72h 2026-10-05"
      - name: vendor updaters (Logitech G HUB, TechSmith)
        tier: generic
        match: {http_user_agent: {regex: '^(GHubDownloader/|STDownloader/)'}}
        evidence: "105 of 11,336"

  - score: 61065c72-5d7d-44ef-bf41-6a36684b545f      # 186486 Elevated System Shell Spawned
    exclusions:
      - name: HAWK vTTAC agent
        tier: hawk
        match: {parent_image: {endswith: '\Program Files\HAWK\vTTAC\hawkvttac.exe'}}
        evidence: "45,561 of 366,149"
      - name: AWS SSM document worker
        tier: generic
        match: {parent_image: {endswith: '\Program Files\Amazon\SSM\ssm-document-worker.exe'}}
        evidence: "23,662 of 366,149"
      - name: Realtek audio service
        tier: generic
        match: {parent_image: {endswith: '\RtkAudUService64.exe'}}
        evidence: "14,980 of 366,149"
      - name: Intune management extension
        tier: generic
        match: {parent_image: {endswith: '\Microsoft Intune Management Extension\AgentExecutor.exe'}}
        evidence: "4,601 of 366,149"

  - score: 8a582fe2-0882-4b89-a82a-da6b2dc32937      # 2135 Suspicious WmiPrvSE Child Process
    exclusions:
      - name: HUNT scanner and service accounts
        tier: customer
        customer: HUNT
        match: {correlation_username: {regex: '^(hawkscan|admhs)$'}}
        evidence: "397 of 397, 72h 2026-10-05"

  - score: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde      # 1957 Shell/Scripting Spawning Suspicious Programs
    exclusions:
      - name: AWS WorkSpaces update agent
        tier: generic
        match:
          resource_name: {regex: '^wsamzn-'}
          parent_command: {contains: '-ExecutionPolicy AllSigned'}
        evidence: "~230 of 234"

  - score: 0c79148b-118e-472b-bdb7-9b57b444cc19      # 2074 Suspicious File Download Using Office Application
    exclusions:
      - name: Office protocol handler opening links
        tier: generic
        match: {parent_image: {endswith: '\Office16\protocolhandler.exe'}}
        evidence: "139 of 230"

  - score: ab6bffca-beff-4baa-af11-6733f296d57a      # 1390 AD User Enumeration
    exclusions:
      - name: ManageEngine ADManager service account
        tier: customer
        customer: HUNT
        match: {correlation_username: {equals: admanager}}
        evidence: "14,178 of 173,937"

  - score: c3a99af4-35a9-4668-879e-c09aeb4f2bdf      # 52285 Rundll32 Execution Without DLL File
    exclusions:
      - name: Windows Installer managed custom action
        tier: generic
        match:
          command: {regex: '\\Windows\\Installer\\MSI[0-9A-F]+\.tmp,zzzzInvokeManagedCustomActionOutOfProc'}
        evidence: "19 of 19 sampled, 2026-10-06"

  - score: 6f8b3439-a203-45dc-a88b-abf57ea15ccf      # 2020 HackTool - CrackMapExec PowerShell Obfuscation
    exclusions:
      - name: HUNT scanner account
        tier: customer
        customer: HUNT
        match: {correlation_username: {equals: hawkscan}}
        evidence: "1 of 1 sampled, 2026-10-06"
      - name: HUNT local-group inventory script (run as SYSTEM and as hawkscan)
        tier: customer
        customer: HUNT
        match: {command: {contains: 'Get-LocalGroup | Select-Object Name, Domain, SID'}}
        evidence: "31 of 31 sampled hits, 24h 2026-10-06"

  - score: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f      # 1909 Copying Sensitive Files with Credential Data
    exclusions:
      - name: Dell TechHub copying SRUDB.dat into its own ProgramData store
        tier: generic
        match: {command: {contains: '\ProgramData\Dell\DTP\DB\SRUDBData'}}
        evidence: "Dell DTP esentutl /y SRUDB.dat /vss, ~all of 961 hits/24h 2026-10-06"

  - score: 52d8b0c6-53d6-439a-9e41-52ad442ad9ad      # 1444 First Time Seen Remote Named Pipe
    exclusions:
      - name: HUNT scanner and BloodHound collector accounts
        tier: customer
        customer: HUNT
        match: {correlation_username: {regex: '^(hawkscan|bhoundsa)$'}}
        evidence: "610 of 1,468 hits/24h 2026-10-06"

  - score: d7bcd677-645d-4691-a8d4-7a5602b780d1      # 2214 Potential PowerShell Command Line Obfuscation
    exclusions:
      - name: MSI product-code helper Convert-GuidToCompressedGuid
        tier: generic
        match: {command: {contains: 'function Convert-GuidToCompressedGuid'}}
        evidence: "294 of 1,000 sampled, 72h 2026-10-06"
      - name: Windows inbox IME compatibility check (CompatTelRunner)
        tier: generic
        match: {command: {contains: '$InboxIMEs = '}}
        evidence: "264 of 1,000 sampled"
      - name: HUNT local-group inventory script
        tier: customer
        customer: HUNT
        match: {command: {contains: 'Get-LocalGroup | Select-Object Name, Domain, SID'}}
        evidence: "91 of 1,000 sampled"

  - score: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0      # 186574 Windows Credential Guard Disabled - Registry
    exclusions:
      - name: Policy / MDM application of LsaCfgFlags (Group Policy via svchost, Intune omadmclient)
        tier: generic
        match: {image: {regex: '\\(svchost|omadmclient)\.exe$'}}
        evidence: "332 of 335 sampled (svchost 318, omadmclient 16); reg.exe / powershell writes still alert"

  - score: dbc2d43f-0fbf-4ceb-b00c-2c5b2fa1590c      # HAWK token replay from hosting ASN (correlation)
    exclusions:
      - name: HUNT corporate AWS egress (WorkSpaces/NAT; 27 and 14 users sign in from them)
        tier: customer
        customer: HUNT
        match: {ip_src: {regex: '^(50\.16\.95\.2|100\.24\.161\.185)$'}}
        evidence: "7d 2026-10-06: 25,597 and 1,388 successful sign-ins"

  - score: 839bb565-29f4-432d-9418-5d9886e8a275      # risky interactive success from hosting ASN
    exclusions:
      - name: HUNT corporate AWS egress
        tier: customer
        customer: HUNT
        match: {ip_src: {regex: '^(50\.16\.95\.2|100\.24\.161\.185)$'}}
        evidence: "same egress addresses"

