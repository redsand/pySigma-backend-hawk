  - score: fd877b94-9bb5-4191-bb25-d79cbd93c167      # 1919 Dumping of Sensitive Hives Via Reg.EXE
    exclusions:
      # Upstream '\system' also matches the reg.exe path itself (C:\Windows\System32\REG.EXE) and
      # C:\Windows\SystemTemp, so any HKLM export from a full-path command line fires. A key under
      # HKLM\SOFTWARE is never the SAM / SECURITY / SYSTEM hive.
      - name: reg save/export of a key under HKLM\SOFTWARE (not a credential hive)
        tier: generic
        match: {command: {regex: '(?i)\s(save|export)\s+"?(hklm|hkey_local_machine)\\software(\\|"|\s|$)'}}
        evidence: "32 of 32 events 24h 2026-10-22 (Windows provisioning ICD regBefore.txt, 7 hosts); upstream logic fix proposed"

