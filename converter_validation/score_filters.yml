    exclusions:
      # The WebClient service runs "rundll32 davclnt.dll,DavSetCookie <host> <url>" for every WebDAV request; the URL
      # is often a folder.jpg thumbnail. The DLL is davclnt.dll, not an image; WebDAV itself has its own rules.
      - name: WebDAV client (davclnt.dll,DavSetCookie) fetching an image over WebDAV
        tier: generic
        match:
          command: {regex: '(?i)^"?(C:\\Windows\\System32\\)?rundll32(\.exe)?"? C:\\Windows\\System32\\davclnt\.dll,DavSetCookie '}
        evidence: "4 of 4 events in 2026-10-26 cases (3 cases, share thumbnails)"

  - score: 736ffa74-5f6f-44ca-94ef-1c0df4f51d2a      # 185946 HackTool - CrackMapExec File Indicators
    exclusions:
